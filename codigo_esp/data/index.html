<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makita clicker · ESP32</title>
    <style>
        :root {
            --bg-void: #0a0a0a;
            --panel: #161616;
            --panel-alt: #202020;
            --panel-edge: #000000;
            --lcd-bg: #050505;
            --red: #ff4342;
            --red-dim: #7a2422;
            --orange: #ff8f43;
            --orange-dim: #b0672f;
            --text-hi: #ffffff;
            --text-lo: #c0c0c0;
            --text-faint: #8a8a8a;
            --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-void);
            font-family: var(--sans);
            color: var(--text-hi);
        }

        body {
            display: flex;
            align-items: stretch;
            justify-content: stretch;
        }

        .game {
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: 300px 1fr 260px;
            overflow: hidden;
        }

        /* ---------- shared bits ---------- */

        .stripes {
            background-image: repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, .015) 0px,
                    rgba(255, 255, 255, .015) 1px,
                    transparent 1px,
                    transparent 18px
            );
        }

        button {
            font-family: inherit;
        }

        button:focus-visible {
            outline: 2px solid var(--orange);
            outline-offset: 2px;
        }

        /* ---------- left: counter + click area ---------- */

        .col-counter {
            background: var(--panel);
            border-right: 1px solid var(--panel-edge);
            display: flex;
            flex-direction: column;
        }

        .counter-head {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--panel-edge);
            background: var(--panel-alt);
        }

        .counter-head__title {
            margin: 0 0 .6rem;
            font-size: .8rem;
            font-weight: 600;
            letter-spacing: .02em;
            color: var(--text-hi);
        }

        .counter-head__digits {
            font-family: var(--mono);
            font-size: 1.9rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--red);
            text-shadow: 0 0 10px rgba(255, 67, 66, .4);
        }

        .counter-head__unit {
            font-size: .95rem;
            font-weight: 400;
            color: var(--text-lo);
            margin-left: .35rem;
        }

        .counter-head__rate {
            margin: .3rem 0 0;
            font-family: var(--mono);
            font-size: .7rem;
            letter-spacing: .04em;
            color: var(--orange);
        }

        .click-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .clicker {
            position: relative;
            width: 12rem;
            height: 12rem;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: radial-gradient(circle at 35% 30%, #ff6b62, #b52e2d);
            box-shadow:
                    inset 0 0 0 2px rgba(255, 255, 255, .12),
                    0 10px 0 var(--panel-edge),
                    0 16px 26px rgba(0, 0, 0, .5);
            transform: translateY(0);
            transition: transform .08s ease, box-shadow .08s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden;
        }

        .clicker__img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .clicker:active {
            transform: translateY(8px);
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .12), 0 2px 0 var(--panel-edge), 0 4px 10px rgba(0, 0, 0, .4);
        }

        .float-plus {
            position: absolute;
            font-family: var(--mono);
            font-weight: 700;
            color: var(--red);
            pointer-events: none;
            animation: float-up .6s ease-out forwards;
        }

        @keyframes float-up {
            from { opacity: 1; transform: translateY(0); }
            to   { opacity: 0; transform: translateY(-40px); }
        }

        .flying-makita {
            position: absolute;
            left: 0;
            top: 0;
            width: 2.6rem;
            height: 2.6rem;
            object-fit: contain;
            pointer-events: none;
            opacity: 1;
            transform: translate(-50%, -50%) rotate(0deg) scale(.6);
            transition: transform 0.9s ease-out, opacity 0.9s ease-out;
            z-index: 5;
        }

        .flying-makita.is-flying {
            opacity: 0;
        }

        .click-hint {
            position: absolute;
            bottom: 1rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: .7rem;
            color: var(--text-faint);
        }

        /* ---------- center: nav + log ---------- */

        .col-center {
            background: var(--bg-void);
            display: flex;
            flex-direction: column;
        }

        .center-nav {
            display: flex;
            border-bottom: 1px solid var(--panel-edge);
        }

        .navbtn {
            background: var(--panel);
            border: none;
            border-right: 1px solid var(--panel-edge);
            color: var(--text-lo);
            font-size: .75rem;
            letter-spacing: .03em;
            padding: .65rem 1.1rem;
            cursor: default;
        }

        .center-log {
            padding: .85rem 1.5rem;
            border-bottom: 1px solid var(--panel-edge);
            background: var(--panel-alt);
            font-size: .82rem;
            color: var(--text-lo);
            text-align: center;
        }

        .center-body {
            flex: 1;
        }

        /* ---------- right: shop ---------- */

        .col-shop {
            background: var(--panel);
            border-left: 1px solid var(--panel-edge);
            display: flex;
            flex-direction: column;
        }

        .shop-head {
            padding: .85rem 1.1rem;
            border-bottom: 1px solid var(--panel-edge);
            text-align: center;
        }

        .shop-head__title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .04em;
            color: var(--orange);
        }

        .shop-toggle {
            display: flex;
            border-bottom: 1px solid var(--panel-edge);
        }

        .shop-toggle button {
            flex: 1;
            border: none;
            background: var(--panel-alt);
            color: var(--text-lo);
            font-size: .7rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: .5rem 0;
            cursor: default;
        }

        .shop-toggle button.is-active {
            background: var(--red-dim);
            color: var(--text-hi);
        }

        .shop-toggle button + button {
            border-left: 1px solid var(--panel-edge);
        }

        .shop-qty {
            display: flex;
            justify-content: center;
            gap: .4rem;
            padding: .55rem 0;
            border-bottom: 1px solid var(--panel-edge);
        }

        .shop-qty button {
            border: 1px solid var(--panel-edge);
            background: transparent;
            color: var(--text-lo);
            font-family: var(--mono);
            font-size: .72rem;
            padding: .2rem .55rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .shop-qty button:hover:not(.is-active) {
            border-color: var(--text-lo);
        }

        .shop-qty button.is-active {
            border-color: var(--orange);
            color: var(--orange);
        }

        .shop-list {
            padding: .75rem;
            display: flex;
            flex-direction: column;
            gap: .55rem;
        }

        .shop-item {
            display: flex;
            align-items: center;
            gap: .7rem;
            width: 100%;
            border: 1px solid var(--panel-edge);
            border-radius: 8px;
            background: var(--panel-alt);
            padding: .55rem .65rem;
            cursor: pointer;
            text-align: left;
            color: var(--text-hi);
            transition: background .1s ease, border-color .1s ease;
        }

        .shop-item:hover:not(:disabled) {
            border-color: var(--orange-dim);
            background: #2a2a2a;
        }

        .shop-item:disabled {
            cursor: default;
            opacity: .5;
        }

        .shop-item__icon {
            width: 2.4rem;
            height: 2.4rem;
            flex-shrink: 0;
            border-radius: 6px;
            background: var(--lcd-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .shop-item__info {
            flex: 1;
            min-width: 0;
        }

        .shop-item__name {
            font-size: .85rem;
            font-weight: 600;
        }

        .shop-item__desc {
            font-size: .68rem;
            color: var(--text-lo);
            margin-top: .1rem;
        }

        .shop-item__cost {
            font-family: var(--mono);
            font-size: .78rem;
            color: var(--red);
            white-space: nowrap;
        }

        .shop-item__owned {
            font-family: var(--mono);
            font-size: .7rem;
            color: var(--text-faint);
            min-width: 1.4rem;
            text-align: right;
        }

        @media (max-width: 760px) {
            .game {
                grid-template-columns: 1fr;
            }
            .col-counter, .col-center, .col-shop {
                border-right: none;
                border-left: none;
                border-bottom: 1px solid var(--panel-edge);
            }
            .col-center {
                min-height: 220px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .float-plus { animation: none; opacity: 0; }
        }
    </style>
</head>
<body>
<div class="game">

    <!-- ===== esquerda: contador + clique ===== -->
    <section class="col-counter">
        <div class="counter-head">
            <p class="counter-head__title">Oficina de Makitas</p>
            <div>
                <span class="counter-head__digits" id="counter">0</span>
                <span class="counter-head__unit">makitas</span>
            </div>
            <p class="counter-head__rate">por segundo: <span id="rate">0</span></p>
        </div>
        <div class="click-area" id="clickArea">
            <button class="clicker" id="makitaBtn" aria-label="Fabricar makita">
                <img class="clicker__img" src="images/makitaCoracao.png" alt="">
            </button>
            <p class="click-hint">clique para fabricar</p>
        </div>
    </section>

    <!-- ===== centro: navegação + log ===== -->
    <section class="col-center">
        <div class="center-nav">
            <button class="navbtn">Estatísticas</button>
        </div>
        <div class="center-log" id="log">Conectando ao servidor do ESP32...</div>
        <div class="center-body stripes"></div>
    </section>

    <!-- ===== direita: loja ===== -->
    <section class="col-shop">
        <div class="shop-head">
            <p class="shop-head__title">Loja</p>
        </div>
        <div class="shop-toggle">
            <button class="is-active">Comprar</button>
        </div>
        <div class="shop-qty" id="shopQty">
            <button class="is-active" data-qty="1">1</button>
            <button data-qty="10">10</button>
            <button data-qty="max">MAX</button>
        </div>
        <!-- os itens da loja são gerados pelo JS a partir da lista `upgrades` -->
        <div class="shop-list" id="shopList"></div>
    </section>

</div>

<script>
    // =====================================================================
    // COMUNICAÇÃO COM O ESP32
    // =====================================================================
    // O ESP32 é o dono do estado real (makitas, mps, quantos de cada upgrade
    // cada jogador comprou). O navegador só manda INTENÇÕES ("cliquei",
    // "quero comprar X") e recebe de volta o estado atualizado — igual ao
    // padrão cliente/servidor usado no arquivo "Global" que você já tinha.
    //
    // Protocolo (texto simples via WebSocket, porta 81, mesmo padrão do
    // servidor do ESP8266/ESP32 usado antes):
    //
    //   Cliente -> ESP32
    //     "CLICK"              → registra um clique manual
    //     "BUY:<id>:<qty>"      → pede pra comprar `qty` unidades do upgrade
    //                            `<id>` (id vem do array `upgrades` abaixo).
    //                            `<qty>` é um número (1, 10, ...) ou a
    //                            palavra "max".
    //                            ex: "BUY:upgrade1:10"  ou  "BUY:upgrade1:max"
    //
    //   ESP32 -> Cliente (JSON, mandado a cada clique/compra e idealmente
    //   também periodicamente pra refletir a produção passiva)
    //     {
    //       "makitas": 123.4,
    //       "mps": 2.5,
    //       "owned": { "upgrade1": 12, "upgrade2": 3 }
    //     }
    //     "owned" é um objeto com a quantidade comprada de CADA upgrade,
    //     usando o mesmo `id` definido no array `upgrades` logo abaixo.
    //     O custo de cada upgrade NÃO precisa vir do ESP32: o navegador
    //     recalcula localmente usando `baseCost`/`growth` de cada upgrade
    //     e a quantidade `owned` recebida — então o ESP32 só precisa saber
    //     e devolver "quantas unidades esse jogador já tem" de cada upgrade.
    //
    // Ajuste o hostname/porta abaixo se o seu servidor no ESP32 usar outro
    // endereço. Se você abrir este HTML direto do disco (file://) em vez de
    // servido pelo próprio ESP32, a conexão WebSocket vai falhar — isso é
    // esperado, só funciona quando a página é servida pelo ESP32 (ou por um
    // servidor que fale o mesmo protocolo na mesma rede).
    const socket = new WebSocket('ws://' + window.location.hostname + ':81/');

    socket.onopen = () => {
        logEl.textContent = 'Conectado à Oficina Global!';
    };

    socket.onclose = () => {
        logEl.textContent = 'Desconectado do servidor. Tentando reconectar...';
    };

    socket.onerror = () => {
        logEl.textContent = 'Erro de conexão com o ESP32.';
    };

    // ---------- estado ----------
    // makitas/mps chegam do ESP32 — o navegador nunca soma nada por conta
    // própria, só reflete o que o servidor manda.
    let makitas = 0;
    let mps = 0; // makitas por segundo, soma de todos os upgrades comprados

    // quantas unidades cada clique de compra vai adquirir — alterado pelos
    // botões 1 / 10 / MAX logo acima da lista de upgrades
    // (precisa existir antes de `upgrades`/`buildShopList` porque o desc
    // de cada item é recalculado com base nela)
    // valor numérico (1, 10) ou a string 'max' (compra o máximo possível
    // respeitando o saldo de makitas e o limite MAX_OWNED)
    let buyQty = 1;

    // nenhum upgrade pode ser comprado mais que isso
    const MAX_OWNED = 100;

    // ---------- upgrades da loja ----------
    // Para adicionar um novo upgrade, basta acrescentar um objeto neste array.
    // O resto do código (renderização, cálculo de custo, compra) é genérico
    // e lê essa lista automaticamente — não precisa mexer no HTML nem duplicar
    // nenhuma função.
    //
    // campos de cada upgrade:
    //   id       identificador único (string, sem espaços) — usado nos ids do DOM
    //   name     nome mostrado na loja
    //   icon     emoji/caractere mostrado no ícone quadrado
    //   baseCost custo da 1ª unidade
    //   growth   multiplicador de custo a cada unidade comprada (1.15 = +15%)
    //   mps      quanto de makitas/s CADA UNIDADE adiciona à produção
    //
    // a descrição (desc) não é mais um texto fixo: ela é calculada em
    // render() a partir de `upgrade.mps * buyQty`, então o texto mostrado na
    // loja sempre reflete o ganho para a quantidade selecionada (1, 10 ou 100).
    //
    // exemplo de um segundo upgrade (é só descomentar e ajustar os números):
    // { id: 'upgrade2', name: 'Upgrade 2', icon: '🔧',
    //   baseCost: 100, growth: 1.15, mps: 5 },
    const upgrades = [
        { id: 'upgrade1', name: 'Upgrade 1', icon: '⚙️', baseCost: 10, growth: 1.10, mps: 0.1 },
    ];

    // quantidade comprada de cada upgrade, indexado por id (preenchido abaixo)
    const owned = {};
    upgrades.forEach(u => { owned[u.id] = 0; });

    // ---------- elementos ----------
    const counterEl = document.getElementById('counter');
    const rateEl = document.getElementById('rate');
    const makitaBtn = document.getElementById('makitaBtn');
    const clickArea = document.getElementById('clickArea');
    const shopListEl = document.getElementById('shopList');
    const shopQtyEl = document.getElementById('shopQty');
    const logEl = document.getElementById('log');

    // custo de UMA unidade adicional, já tendo comprado `count` unidades antes
    function unitCost(upgrade, count) {
        return Math.ceil(upgrade.baseCost * Math.pow(upgrade.growth, count));
    }

    // custo total para comprar `qty` unidades de uma vez, a partir da
    // quantidade já possuída — soma o custo de cada unidade individualmente,
    // já que o preço sobe a cada compra
    function costForQuantity(upgrade, qty) {
        let total = 0;
        for (let i = 0; i < qty; i++) {
            total += unitCost(upgrade, owned[upgrade.id] + i);
        }
        return total;
    }

    function formatNumber(n) {
        return Math.floor(n).toString();
    }

    // texto de descrição do upgrade, recalculado para a quantidade de
    // compra efetiva (já limitada pelo teto de 100 e, no caso de 'max',
    // pelo saldo de makitas): mostra quanto de makitas/s aquela compra
    // vai adicionar
    function descForQty(upgrade, qty) {
        const gain = upgrade.mps * qty;
        return `+${gain.toFixed(1)} makita/s (${qty}x)`;
    }

    // calcula quantas unidades REALMENTE serão compradas e por qual custo,
    // considerando:
    //   - o teto MAX_OWNED (nenhum upgrade passa de 100 unidades)
    //   - no modo 'max', o saldo atual de makitas (compra o máximo possível)
    //   - nos modos 1/10, a quantidade pedida é reduzida se faltar espaço
    //     até o teto (ex.: faltando 3 pra bater 100, "10x" vira 3x)
    function computeBuy(upgrade) {
        const remaining = MAX_OWNED - owned[upgrade.id];
        if (remaining <= 0) return { qty: 0, cost: 0 };

        if (buyQty === 'max') {
            let qty = 0;
            let cost = 0;
            while (qty < remaining) {
                const next = unitCost(upgrade, owned[upgrade.id] + qty);
                if (cost + next > makitas) break;
                cost += next;
                qty++;
            }
            return { qty, cost };
        }

        const qty = Math.min(buyQty, remaining);
        return { qty, cost: costForQuantity(upgrade, qty) };
    }

    // troca a quantidade de compra ativa (1, 10 ou 'max')
    function setBuyQty(qty) {
        buyQty = qty;
        shopQtyEl.querySelectorAll('button').forEach(btn => {
            btn.classList.toggle('is-active', btn.dataset.qty === String(qty));
        });
        render();
    }

    shopQtyEl.querySelectorAll('button').forEach(btn => {
        const raw = btn.dataset.qty;
        btn.addEventListener('click', () => setBuyQty(raw === 'max' ? 'max' : Number(raw)));
    });

    // monta os botões da loja uma vez, a partir da lista `upgrades`
    function buildShopList() {
        upgrades.forEach(upgrade => {
            const btn = document.createElement('button');
            btn.className = 'shop-item';
            btn.id = 'buy-' + upgrade.id;
            btn.innerHTML = `
                <span class="shop-item__icon">${upgrade.icon}</span>
                <span class="shop-item__info">
                    <span class="shop-item__name">${upgrade.name}</span>
                    <span class="shop-item__desc" id="desc-${upgrade.id}"></span>
                </span>
                <span class="shop-item__cost" id="cost-${upgrade.id}"></span>
                <span class="shop-item__owned" id="owned-${upgrade.id}"></span>
            `;
            btn.addEventListener('click', () => buyUpgrade(upgrade));
            shopListEl.appendChild(btn);
        });
    }

    // pede pro ESP32 comprar o upgrade. `qty` é calculado localmente só
    // pra decidir SE vale a pena mandar a mensagem (evita clique em botão
    // desabilitado) — quem decide o resultado de verdade é o servidor, que
    // vai responder com o novo `owned`/`makitas`/`mps` via WebSocket.
    function buyUpgrade(upgrade) {
        const { qty } = computeBuy(upgrade);
        if (qty <= 0) return;
        if (socket.readyState === WebSocket.OPEN) {
            socket.send(`BUY:${upgrade.id}:${buyQty}`);
        }
    }

    function render() {
        counterEl.textContent = formatNumber(makitas);
        rateEl.textContent = mps.toFixed(1);

        upgrades.forEach(upgrade => {
            const capped = owned[upgrade.id] >= MAX_OWNED;
            const { qty, cost } = computeBuy(upgrade);

            document.getElementById('cost-' + upgrade.id).textContent = capped ? '—' : cost;
            document.getElementById('owned-' + upgrade.id).textContent = owned[upgrade.id];
            document.getElementById('desc-' + upgrade.id).textContent =
                capped ? 'nível máximo atingido' : descForQty(upgrade, qty);
            document.getElementById('buy-' + upgrade.id).disabled = capped || qty <= 0 || makitas < cost;
        });
    }

    function showFloatPlus(amount) {
        const rect = makitaBtn.getBoundingClientRect();
        const areaRect = clickArea.getBoundingClientRect();
        const el = document.createElement('span');
        el.className = 'float-plus';
        el.textContent = '+' + amount;
        el.style.left = (rect.left - areaRect.left + rect.width / 2) + 'px';
        el.style.top = (rect.top - areaRect.top) + 'px';
        clickArea.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
    }

    // dispara uma imagem "voando" a partir do centro do clicker — uma a
    // cada clique, saindo em uma direção/rotação/tamanho aleatórios.
    // Usa transition (em vez de @keyframes com custom properties) porque
    // é mais confiável entre navegadores: setamos o estado inicial, forçamos
    // o navegador a "aplicar" esse estado (reflow) e só então mudamos pro
    // estado final — o CSS cuida da transição automaticamente.
    function spawnFlyingMakita() {
        const rect = makitaBtn.getBoundingClientRect();
        const areaRect = clickArea.getBoundingClientRect();

        const img = document.createElement('img');
        img.className = 'flying-makita';
        img.src = 'images/makitaCoracao.png';
        img.alt = '';

        const size = 1.8 + Math.random() * 1.6; // rem
        img.style.width = size + 'rem';
        img.style.height = size + 'rem';

        // posição inicial: centro do botão, relativa à área de clique
        const startX = rect.left - areaRect.left + rect.width / 2;
        const startY = rect.top - areaRect.top + rect.height / 2;
        img.style.left = startX + 'px';
        img.style.top = startY + 'px';

        clickArea.appendChild(img);

        // direção aleatória em qualquer sentido, distância variável
        const angle = Math.random() * Math.PI * 2;
        const distance = 90 + Math.random() * 140;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - 40; // leve tendência pra cima
        const rot = Math.random() * 720 - 360;

        // força o navegador a "commitar" o estado inicial antes de mudar,
        // senão a transição não roda (o browser só vê o estado final)
        // eslint-disable-next-line no-unused-expressions
        img.offsetWidth;

        img.style.transform = `translate(calc(-50% + ${tx.toFixed(1)}px), calc(-50% + ${ty.toFixed(1)}px)) rotate(${rot.toFixed(0)}deg) scale(.8)`;
        img.classList.add('is-flying');

        let removed = false;
        const remove = () => {
            if (removed) return;
            removed = true;
            img.remove();
        };
        img.addEventListener('transitionend', remove);
        // rede de segurança: remove mesmo se o evento de transição não disparar
        setTimeout(remove, 1200);
    }

    // feedback visual instantâneo do clique — não mexe em `makitas`/`mps`
    // (isso só muda quando o ESP32 manda a atualização de verdade)
    function playClickFeedback() {
        showFloatPlus(1);
        spawnFlyingMakita();
    }

    // clique manual — mesma ação que o botão físico do ESP32 vai disparar.
    // Mostra o feedback na hora e avisa o servidor pelo WebSocket; o
    // contador só é atualizado quando a resposta chegar em socket.onmessage.
    makitaBtn.addEventListener('click', () => {
        playClickFeedback();
        if (socket.readyState === WebSocket.OPEN) {
            socket.send('CLICK');
        }
    });

    // recebe o estado atualizado do ESP32 (makitas, mps e quantos de cada
    // upgrade o jogador já tem) e re-renderiza a tela com esses valores
    socket.onmessage = (event) => {
        let data;
        try {
            data = JSON.parse(event.data);
        } catch (err) {
            console.error('Mensagem inválida do ESP32:', event.data, err);
            return;
        }

        if (typeof data.makitas === 'number') makitas = data.makitas;
        if (typeof data.mps === 'number') mps = data.mps;
        if (data.owned && typeof data.owned === 'object') {
            upgrades.forEach(upgrade => {
                if (upgrade.id in data.owned) {
                    owned[upgrade.id] = data.owned[upgrade.id];
                }
            });
        }

        render();
    };

    buildShopList();
    render();
</script>
</body>
</html>
